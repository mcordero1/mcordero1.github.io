# Solo servicio gratuito. PostgreSQL se configura por separado en Neon Free.
services:
  - type: web
    name: marcos-cordero-perfil
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
